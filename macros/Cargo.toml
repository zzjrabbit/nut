[package]
name = "nut-macros"
version.workspace = true
edition.workspace = true
description = "Support crate for nut"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.117", features = ["full"] }

[dev-dependencies]
trybuild = "1.0.116"
