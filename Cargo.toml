[package]
name = "nut"
version.workspace = true
edition.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
members = ["examples/mlp", "macros"]
default-members = ["examples/mlp"]

[workspace.dependencies]
nut-macros = { version = "0.1.0", path = "macros" }

[dependencies]
ndarray = { version = "0.17.2", optional = true }
num-traits = "0.2.19"
nut-macros.workspace = true
rand = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
default = ["ndarray"]
ndarray = ["dep:ndarray"]
